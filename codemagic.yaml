workflows:
  ios-unsigned:
    name: ReefSight iOS (unsigned build)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r ../../../reefsight-unsigned.ipa Payload
    artifacts:
      - reefsight-unsigned.ipa
      - flutter_drive.log
